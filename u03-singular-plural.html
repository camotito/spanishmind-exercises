<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Singular y Plural · SpanishMind</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#faf7f2; --card:#ffffff; --accent:#b85c38; --accent2:#e8c4a0; --text:#2a1f14; --muted:#8a7a6a; --ok:#3a7d44; --err:#c0392b; --border:#e0d6c8; }
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; font-weight:300; min-height:100vh; padding:2rem 1rem 4rem; }
    header { text-align:center; margin-bottom:2rem; }
    .brand { font-family:'Playfair Display',serif; font-size:0.85rem; letter-spacing:0.25em; text-transform:uppercase; color:var(--accent); margin-bottom:0.5rem; }
    h1 { font-family:'Playfair Display',serif; font-size:clamp(1.8rem,5vw,2.8rem); font-weight:700; line-height:1.1; }
    .subtitle { margin-top:0.5rem; color:var(--muted); font-size:0.95rem; }
    .section-title { font-family:'Playfair Display',serif; font-style:italic; color:var(--muted); font-size:0.95rem; text-align:center; max-width:640px; margin:1.5rem auto 0.75rem; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:2rem; max-width:640px; margin:0 auto 1.5rem; box-shadow:0 2px 12px rgba(0,0,0,0.04); }
    .exercise { display:flex; align-items:center; gap:0.75rem; padding:1rem 0; border-bottom:1px solid var(--border); flex-wrap:wrap; }
    .exercise:last-child { border-bottom:none; }
    .num { font-family:'Playfair Display',serif; font-style:italic; color:var(--accent); min-width:1.4rem; }
    .sing { font-family:'Playfair Display',serif; font-style:italic; font-size:1.05rem; flex:1; min-width:100px; }
    .arrow { color:var(--muted); font-size:1rem; }
    .blank-wrap { display:inline-flex; flex-direction:column; align-items:center; }
    input[type="text"] { font-family:'DM Sans',sans-serif; font-size:1rem; width:120px; border:none; border-bottom:2px solid var(--accent2); background:transparent; color:var(--text); padding:2px 4px; text-align:center; outline:none; transition:border-color 0.2s; }
    input[type="text"]:focus { border-color:var(--accent); }
    input[type="text"].correct { border-color:var(--ok); color:var(--ok); }
    input[type="text"].wrong { border-color:var(--err); color:var(--err); }
    .hint { font-size:0.7rem; color:var(--muted); margin-top:1px; font-style:italic; }
    .btn-row { display:flex; gap:0.75rem; justify-content:center; max-width:640px; margin:0 auto 1.5rem; flex-wrap:wrap; }
    button { font-family:'DM Sans',sans-serif; font-size:0.9rem; font-weight:500; padding:0.65rem 1.4rem; border-radius:6px; border:none; cursor:pointer; transition:opacity 0.15s,transform 0.1s; }
    button:active { transform:scale(0.97); }
    .btn-check { background:var(--accent); color:#fff; }
    .btn-reset { background:transparent; border:1px solid var(--border); color:var(--muted); }
    .btn-reveal { background:transparent; border:1px solid var(--accent2); color:var(--accent); }
    .score-box { display:none; text-align:center; padding:0.75rem 1rem; border-radius:8px; font-size:0.95rem; max-width:640px; margin:0 auto 1.5rem; background:var(--accent2); color:var(--text); }
    /* MC */
    .mc-item { padding:1rem 0; border-bottom:1px solid var(--border); }
    .mc-item:last-child { border-bottom:none; }
    .mc-q { font-size:1rem; margin-bottom:0.6rem; }
    .mc-q .mc-num { font-family:'Playfair Display',serif; font-style:italic; color:var(--accent); margin-right:0.3rem; }
    .mc-q em { font-family:'Playfair Display',serif; color:var(--text); }
    .mc-opts { display:flex; gap:0.4rem; flex-wrap:wrap; }
    .mc-btn { font-size:0.9rem; padding:0.35rem 0.9rem; border-radius:6px; border:1px solid var(--border); background:transparent; cursor:pointer; transition:all 0.15s; color:var(--text); font-family:'DM Sans',sans-serif; }
    .mc-btn.selected { border-color:var(--accent2); background:var(--accent2); }
    .mc-btn.correct { background:var(--ok)!important; color:white!important; border-color:var(--ok)!important; }
    .mc-btn.wrong { background:var(--err)!important; color:white!important; border-color:var(--err)!important; }
    .mc-btn.reveal { background:var(--ok); color:white; border-color:var(--ok); opacity:0.7; }
    footer { text-align:center; margin-top:2.5rem; font-size:0.8rem; color:var(--muted); }
    footer a { color:var(--accent); text-decoration:none; }
  </style>
</head>
<body>
<header>
  <div class="brand">SpanishMind</div>
  <h1>Singular y Plural</h1>
  <p class="subtitle">Unidad 3 · Formación del plural</p>
</header>

<p class="section-title">Ejercicio 1 — Escribe el plural</p>
<div class="card" id="transform-card"></div>
<div class="btn-row">
  <button class="btn-check" onclick="checkTransform()">Corregir</button>
  <button class="btn-reveal" onclick="revealTransform()">Ver respuestas</button>
  <button class="btn-reset" onclick="resetTransform()">Empezar de nuevo</button>
</div>
<div id="score-1" class="score-box"></div>

<p class="section-title">Ejercicio 2 — ¿Cuál es el plural correcto?</p>
<div class="card" id="mc-card"></div>
<div class="btn-row">
  <button class="btn-check" onclick="checkMC()">Corregir</button>
  <button class="btn-reveal" onclick="revealMC()">Ver respuestas</button>
  <button class="btn-reset" onclick="resetMC()">Empezar de nuevo</button>
</div>
<div id="score-2" class="score-box"></div>

<footer><a href="https://spanishmind.se">spanishmind.se</a></footer>

<script>
// ── Exercise 1: Singular → Plural ──────────────────────
const TRANSFORMS = [
  { singular:"libro",    plural:"libros",    hint:"vocal → +s"         },
  { singular:"ciudad",   plural:"ciudades",  hint:"consonante → +es"   },
  { singular:"autobús",  plural:"autobuses", hint:"consonante → +es"   },
  { singular:"lápiz",    plural:"lápices",   hint:"-z → -ces"          },
  { singular:"martes",   plural:"martes",    hint:"sin cambio"         },
  { singular:"flor",     plural:"flores",    hint:"consonante → +es"   },
  { singular:"café",     plural:"cafés",     hint:"vocal acentuada → +s"},
  { singular:"voz",      plural:"voces",     hint:"-z → -ces"          },
  { singular:"sofá",     plural:"sofás",     hint:"vocal acentuada → +s"},
  { singular:"luz",      plural:"luces",     hint:"-z → -ces"          },
];

const tCard = document.getElementById('transform-card');
TRANSFORMS.forEach((item, i) => {
  const row = document.createElement('div');
  row.className = 'exercise';
  row.innerHTML = `<span class="num">${i+1}.</span>
    <span class="sing">${item.singular}</span>
    <span class="arrow">→</span>
    <span class="blank-wrap">
      <input type="text" id="tr-${i}" autocomplete="off" spellcheck="false" placeholder="..."
             onkeydown="if(event.key==='Enter') checkTransform()">
      <span class="hint">${item.hint}</span>
    </span>`;
  tCard.appendChild(row);
});

function norm(s) { return s.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }

function checkTransform() {
  let correct = 0, answered = 0;
  TRANSFORMS.forEach((item, i) => {
    const inp = document.getElementById('tr-'+i);
    if (!inp.value.trim()) return;
    answered++;
    const ok = norm(inp.value) === norm(item.plural);
    inp.classList.toggle('correct', ok);
    inp.classList.toggle('wrong', !ok);
    if (ok) correct++;
  });
  if (answered > 0) showScore('score-1', correct, answered);
}
function revealTransform() {
  TRANSFORMS.forEach((item, i) => {
    const inp = document.getElementById('tr-'+i);
    inp.value = item.plural; inp.classList.add('correct'); inp.classList.remove('wrong');
  });
  document.getElementById('score-1').style.display = 'none';
}
function resetTransform() {
  TRANSFORMS.forEach((_, i) => {
    const inp = document.getElementById('tr-'+i);
    inp.value = ''; inp.classList.remove('correct','wrong');
  });
  document.getElementById('score-1').style.display = 'none';
}

// ── Exercise 2: MC correct plural ──────────────────────
const MC_ITEMS = [
  { singular:"el menú",   options:["menús","menus","menúes"],      answer:"menús"    },
  { singular:"el país",   options:["países","paiss","paises"],     answer:"países"   },
  { singular:"el jueves", options:["jueveses","jueves","juevess"], answer:"jueves"   },
  { singular:"el actor",  options:["actores","actors","actors"],   answer:"actores"  },
  { singular:"la crisis", options:["crisis","crises","crisiss"],   answer:"crisis"   },
  { singular:"el pez",    options:["pezs","pezes","peces"],        answer:"peces"    },
  { singular:"el rubí",   options:["rubís","rubíes","rubies"],     answer:"rubíes"   },
];

const mcSel = {};
const mcCard = document.getElementById('mc-card');
MC_ITEMS.forEach((item, i) => {
  mcSel[i] = null;
  const div = document.createElement('div');
  div.className = 'mc-item';
  const optsHTML = item.options.map(o =>
    `<button class="mc-btn" id="mc-${i}-${o}" onclick="selMC(${i},'${o}')">${o}</button>`
  ).join('');
  div.innerHTML = `<div class="mc-q"><span class="mc-num">${i+1}.</span> <em>${item.singular}</em> → los/las ___</div>
    <div class="mc-opts">${optsHTML}</div>`;
  mcCard.appendChild(div);
});

function selMC(i, opt) {
  const prev = mcSel[i];
  if (prev) document.getElementById(`mc-${i}-${prev}`).classList.remove('selected');
  mcSel[i] = mcSel[i] === opt ? null : opt;
  if (mcSel[i]) document.getElementById(`mc-${i}-${mcSel[i]}`).classList.add('selected');
}
function checkMC() {
  let correct = 0, answered = 0;
  MC_ITEMS.forEach((item, i) => {
    if (!mcSel[i]) return;
    answered++;
    item.options.forEach(o => document.getElementById(`mc-${i}-${o}`).classList.remove('selected','correct','wrong','reveal'));
    if (mcSel[i] === item.answer) { correct++; document.getElementById(`mc-${i}-${item.answer}`).classList.add('correct'); }
    else { document.getElementById(`mc-${i}-${mcSel[i]}`).classList.add('wrong'); document.getElementById(`mc-${i}-${item.answer}`).classList.add('reveal'); }
  });
  if (answered > 0) showScore('score-2', correct, answered);
}
function revealMC() {
  MC_ITEMS.forEach((item, i) => {
    item.options.forEach(o => document.getElementById(`mc-${i}-${o}`).classList.remove('selected','correct','wrong','reveal'));
    document.getElementById(`mc-${i}-${item.answer}`).classList.add('reveal');
  });
  document.getElementById('score-2').style.display = 'none';
}
function resetMC() {
  MC_ITEMS.forEach((item, i) => {
    mcSel[i] = null;
    item.options.forEach(o => document.getElementById(`mc-${i}-${o}`).classList.remove('selected','correct','wrong','reveal'));
  });
  document.getElementById('score-2').style.display = 'none';
}
function showScore(id, correct, total) {
  const box = document.getElementById(id);
  box.style.display = 'block';
  box.innerHTML = `<strong>${correct} de ${total}</strong> correctas`;
}
</script>
</body>
</html>
