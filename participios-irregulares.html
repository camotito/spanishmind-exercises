<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Participios Irregulares · SpanishMind</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    /* ─── EDIT ZONE: change colours here ─── */
    :root {
      --bg:        #faf7f2;
      --card:      #ffffff;
      --accent:    #b85c38;
      --accent2:   #e8c4a0;
      --text:      #2a1f14;
      --muted:     #8a7a6a;
      --ok:        #3a7d44;
      --err:       #c0392b;
      --border:    #e0d6c8;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
    }

    /* ── Header ── */
    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    .brand {
      font-family: 'Playfair Display', serif;
      font-size: 0.85rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      font-weight: 700;
      line-height: 1.1;
      color: var(--text);
    }
    .subtitle {
      margin-top: 0.6rem;
      color: var(--muted);
      font-size: 0.95rem;
    }

    /* ── Card ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      max-width: 640px;
      margin: 0 auto 1.5rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    }

    /* ── Exercises ── */
    .exercise {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      padding: 1rem 0;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .exercise:last-child { border-bottom: none; }

    .num {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      color: var(--accent);
      min-width: 1.4rem;
      font-size: 1rem;
    }
    .sentence {
      font-size: 1rem;
      line-height: 1.7;
      flex: 1;
      min-width: 0;
    }

    .blank-wrap {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      vertical-align: baseline;
      margin: 0 2px;
      position: relative;
    }

    input[type="text"] {
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 400;
      width: 100px;
      border: none;
      border-bottom: 2px solid var(--accent2);
      background: transparent;
      color: var(--text);
      padding: 2px 4px;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    input[type="text"].correct { border-color: var(--ok); color: var(--ok); }
    input[type="text"].wrong   { border-color: var(--err); color: var(--err); }

    .hint {
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 1px;
      font-style: italic;
    }
    .feedback-icon {
      font-size: 0.75rem;
      height: 1rem;
    }

    /* ── Buttons ── */
    .btn-row {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      max-width: 640px;
      margin: 0 auto 1.5rem;
      flex-wrap: wrap;
    }
    button {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 0.65rem 1.4rem;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    button:active { transform: scale(0.97); }

    .btn-check  { background: var(--accent); color: #fff; }
    .btn-reset  { background: transparent; border: 1px solid var(--border); color: var(--muted); }
    .btn-reveal { background: transparent; border: 1px solid var(--accent2); color: var(--accent); }

    /* ── Score ── */
    #score-box {
      display: none;
      text-align: center;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.95rem;
      max-width: 640px;
      margin: 0 auto 1.5rem;
      background: var(--accent2);
      color: var(--text);
    }
    #score-box strong { font-weight: 500; }

    /* ── Vocabulary table ── */
    .vocab-card h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      font-weight: 400;
      font-style: italic;
      color: var(--muted);
      margin-bottom: 1rem;
    }
    .vocab-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 0.5rem;
    }
    .vocab-item {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
      background: var(--bg);
      border: 1px solid var(--border);
    }
    .vocab-item .inf  { color: var(--muted); }
    .vocab-item .part { font-weight: 500; color: var(--accent); }

    /* ── Footer ── */
    footer {
      text-align: center;
      margin-top: 2.5rem;
      font-size: 0.8rem;
      color: var(--muted);
    }
    footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>

<header>
  <div class="brand">SpanishMind</div>
  <h1>Participios Irregulares</h1>
  <p class="subtitle">Completa las oraciones con el participio correcto.</p>
</header>

<!-- ════════════════════════════════════════════════════
     ZONA DE EDICIÓN: cambia los ejercicios aquí abajo.
     Cada objeto tiene: "before", "verb" (infinitivo
     entre paréntesis), "after" y "answer".
     ════════════════════════════════════════════════════ -->
<script>
const EXERCISES = [
  { before: "¿Qué has",            verb: "hacer",    after: "hoy en el trabajo?",                    answer: "hecho"   },
  { before: "Te he",               verb: "decir",    after: "la verdad muchas veces.",                answer: "dicho"   },
  { before: "Todavía no hemos",    verb: "ver",      after: "esa película en el cine.",               answer: "visto"   },
  { before: "¿Quién ha",           verb: "abrir",    after: "la ventana de la cocina?",               answer: "abierto" },
  { before: "Juan ha",             verb: "escribir", after: "un correo electrónico muy largo.",        answer: "escrito" },
  { before: "El vaso de cristal se ha", verb: "romper", after: "al caer al suelo.",                   answer: "roto"    },
  { before: "Mis amigos ya han",   verb: "volver",   after: "de sus vacaciones en la playa.",         answer: "vuelto"  },
];
</script>

<!-- Exercise card (built by JS) -->
<div class="card" id="exercise-card"></div>

<div class="btn-row">
  <button class="btn-check"  onclick="checkAll()">Corregir</button>
  <button class="btn-reveal" onclick="revealAll()">Ver respuestas</button>
  <button class="btn-reset"  onclick="resetAll()">Empezar de nuevo</button>
</div>

<div id="score-box"></div>

<footer>
  <a href="https://spanishmind.se">spanishmind.se</a>
</footer>

<script>
// ── Build exercises ──────────────────────────────────
const card = document.getElementById('exercise-card');

EXERCISES.forEach((ex, i) => {
  const row = document.createElement('div');
  row.className = 'exercise';

  row.innerHTML = `
    <span class="num">${i + 1}.</span>
    <span class="sentence">
      ${ex.before}
      <span class="blank-wrap">
        <input type="text" id="inp-${i}" autocomplete="off" spellcheck="false"
               placeholder="..." data-answer="${ex.answer}"
               onkeydown="if(event.key==='Enter') checkAll()">
        <span class="hint">(${ex.verb})</span>
      </span>
      ${ex.after}
    </span>`;
  card.appendChild(row);
});

// ── Check ────────────────────────────────────────────
function normalize(s) {
  return s.trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

function checkAll() {
  let correct = 0;
  EXERCISES.forEach((ex, i) => {
    const inp = document.getElementById('inp-' + i);
    const ok = normalize(inp.value) === normalize(ex.answer);
    inp.classList.toggle('correct', ok);
    inp.classList.toggle('wrong', !ok && inp.value.trim() !== '');
    if (ok) correct++;
  });

  const total = EXERCISES.length;
  const box = document.getElementById('score-box');
  const answered = [...document.querySelectorAll('[id^="inp-"]')]
                     .filter(i => i.value.trim() !== '').length;
  if (answered > 0) {
    box.style.display = 'block';
    box.innerHTML = `<strong>${correct} de ${total}</strong> correctas`;
  }
}

// ── Reveal ───────────────────────────────────────────
function revealAll() {
  EXERCISES.forEach((ex, i) => {
    const inp = document.getElementById('inp-' + i);
    inp.value = ex.answer;
    inp.classList.add('correct');
    inp.classList.remove('wrong');
  });
  document.getElementById('score-box').style.display = 'none';
}

// ── Reset ────────────────────────────────────────────
function resetAll() {
  EXERCISES.forEach((_, i) => {
    const inp = document.getElementById('inp-' + i);
    inp.value = '';
    inp.classList.remove('correct', 'wrong');
  });
  document.getElementById('score-box').style.display = 'none';
}
</script>
</body>
</html>
