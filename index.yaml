# Índice v2 — sin numeración: identidad por slug estable + grafo de dependencias.
# El orden de estudio NO se escribe a mano: se deriva por orden topológico de `depende_de`.
# Puedes añadir, borrar o partir temas tocando solo las aristas del tema afectado.
#
# Campos:
#   tema:                  slug estable (identificador único)
#   titulo:                nombre legible y amigable (con ejemplos, sin jerga gramatical) — se muestra en la página
#   descripcion_gramatical: nombre técnico del tema gramatical — NO se muestra, solo para buscar/ubicar por terminología
#   depende_de:            lista de slugs que conviene dominar antes (aristas del DAG)
#   ejercicios_permitidos: tipologías que TÚ autorizas para este tema (no las elige la LLM) —
#                          para temas con unidad_libro, se derivan de las tipologías que
#                          realmente aparecen en ejemplos/<tema>.json (no es un guess) —
#                          ver libro_pipeline/sync_ejercicios_permitidos.py
#   forma_verbal:          tiempo/forma verbal NUEVA que introduce este tema (null si no
#                          introduce ninguna) — de aquí sale tiempos_permitidos: se acumula
#                          recorriendo el grafo de depende_de (ver
#                          libro_pipeline/compute_tiempos_permitidos.py), no se escribe a mano
#   tiempos_permitidos:    CALCULADO, no editar a mano (correr compute_tiempos_permitidos.py) —
#                          unión de forma_verbal de este tema + todos sus ancestros en el grafo
#   grafico:               tipo de soporte gráfico o 'none'
#   unidad_libro:          número de unidad en "Gramática de uso del español" (Aragonés/Palencia),
#                          si este tema viene de ahí — permite cruzar con ejemplos/<tema>.json

