<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artículo Determinado vs Indeterminado · SpanishMind</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#faf7f2; --card:#ffffff; --accent:#b85c38; --accent2:#e8c4a0; --text:#2a1f14; --muted:#8a7a6a; --ok:#3a7d44; --err:#c0392b; --border:#e0d6c8; }
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; font-weight:300; min-height:100vh; padding:2rem 1rem 4rem; }
    header { text-align:center; margin-bottom:2rem; }
    .brand { font-family:'Playfair Display',serif; font-size:0.85rem; letter-spacing:0.25em; text-transform:uppercase; color:var(--accent); margin-bottom:0.5rem; }
    h1 { font-family:'Playfair Display',serif; font-size:clamp(1.6rem,5vw,2.6rem); font-weight:700; line-height:1.1; }
    .subtitle { margin-top:0.5rem; color:var(--muted); font-size:0.95rem; }
    .section-title { font-family:'Playfair Display',serif; font-style:italic; color:var(--muted); font-size:0.95rem; text-align:center; max-width:680px; margin:1.5rem auto 0.75rem; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:2rem; max-width:680px; margin:0 auto 1.5rem; box-shadow:0 2px 12px rgba(0,0,0,0.04); }
    .exercise { padding:1rem 0; border-bottom:1px solid var(--border); }
    .exercise:last-child { border-bottom:none; }
    .ex-line { display:flex; align-items:baseline; gap:0.4rem; flex-wrap:wrap; font-size:1rem; line-height:1.9; }
    .num { font-family:'Playfair Display',serif; font-style:italic; color:var(--accent); min-width:1.4rem; flex-shrink:0; }
    input[type="text"] { font-family:'DM Sans',sans-serif; font-size:1rem; width:70px; border:none; border-bottom:2px solid var(--accent2); background:transparent; color:var(--text); padding:2px 4px; text-align:center; outline:none; transition:border-color 0.2s; }
    input[type="text"]:focus { border-color:var(--accent); }
    input[type="text"].correct { border-color:var(--ok); color:var(--ok); }
    input[type="text"].wrong { border-color:var(--err); color:var(--err); }
    .ex-note { font-size:0.75rem; color:var(--muted); font-style:italic; margin-top:0.3rem; padding-left:1.8rem; }
    .btn-row { display:flex; gap:0.75rem; justify-content:center; max-width:680px; margin:0 auto 1.5rem; flex-wrap:wrap; }
    button { font-family:'DM Sans',sans-serif; font-size:0.9rem; font-weight:500; padding:0.65rem 1.4rem; border-radius:6px; border:none; cursor:pointer; transition:transform 0.1s; }
    button:active { transform:scale(0.97); }
    .btn-check { background:var(--accent); color:#fff; }
    .btn-reset { background:transparent; border:1px solid var(--border); color:var(--muted); }
    .btn-reveal { background:transparent; border:1px solid var(--accent2); color:var(--accent); }
    .score-box { display:none; text-align:center; padding:0.75rem 1rem; border-radius:8px; font-size:0.95rem; max-width:680px; margin:0 auto 1.5rem; background:var(--accent2); color:var(--text); }
    .mc-item { padding:1rem 0; border-bottom:1px solid var(--border); }
    .mc-item:last-child { border-bottom:none; }
    .mc-q { font-size:1rem; line-height:1.6; margin-bottom:0.6rem; }
    .mc-num { font-family:'Playfair Display',serif; font-style:italic; color:var(--accent); margin-right:0.3rem; }
    .mc-opts { display:flex; gap:0.4rem; flex-wrap:wrap; }
    .mc-btn { font-size:0.9rem; padding:0.35rem 0.9rem; border-radius:6px; border:1px solid var(--border); background:transparent; cursor:pointer; transition:all 0.15s; color:var(--text); }
    .mc-btn.selected { border-color:var(--accent2); background:var(--accent2); }
    .mc-btn.correct { background:var(--ok)!important; color:white!important; border-color:var(--ok)!important; }
    .mc-btn.wrong { background:var(--err)!important; color:white!important; border-color:var(--err)!important; }
    .mc-btn.reveal { background:var(--ok); color:white; border-color:var(--ok); opacity:0.7; }
    footer { text-align:center; margin-top:2.5rem; font-size:0.8rem; color:var(--muted); }
    footer a { color:var(--accent); text-decoration:none; }
  </style>
</head>
<body>
<header>
  <div class="brand">SpanishMind</div>
  <h1>Determinado vs Indeterminado</h1>
  <p class="subtitle">Unidad 7 · un perro / el perro</p>
</header>

<p class="section-title">Ejercicio 1 — Primera y segunda mención: completa los dos huecos</p>
<div class="card" id="double-card"></div>
<div class="btn-row">
  <button class="btn-check" onclick="checkDouble()">Corregir</button>
  <button class="btn-reveal" onclick="revealDouble()">Ver respuestas</button>
  <button class="btn-reset" onclick="resetDouble()">Empezar de nuevo</button>
</div>
<div id="score-1" class="score-box"></div>

<p class="section-title">Ejercicio 2 — ¿Cuál es el artículo adecuado según el contexto?</p>
<div class="card" id="mc-card"></div>
<div class="btn-row">
  <button class="btn-check" onclick="checkMC()">Corregir</button>
  <button class="btn-reveal" onclick="revealMC()">Ver respuestas</button>
  <button class="btn-reset" onclick="resetMC()">Empezar de nuevo</button>
</div>
<div id="score-2" class="score-box"></div>

<footer><a href="https://spanishmind.se">spanishmind.se</a></footer>

<script>
// ── Exercise 1: Double blank (first/second mention) ────
const DOUBLE = [
  { parts:["Hay"," gato en el jardín."," gato es completamente negro."], answers:["un","El"], note:"1ª mención → indeterminado · 2ª mención → determinado" },
  { parts:["Tengo"," piso en Madrid."," piso tiene dos habitaciones."], answers:["un","El"], note:"" },
  { parts:["Hay"," chica esperando en la puerta."," chica pregunta por ti."], answers:["una","La"], note:"" },
  { parts:["Vi"," película ayer."," película era muy larga."], answers:["una","La"], note:"" },
  { parts:["Hay"," problema con el ordenador."," problema es muy complicado."], answers:["un","El"], note:"" },
  { parts:["Compré"," libro muy interesante."," libro se llama 'Cien años de soledad'."], answers:["un","El"], note:"" },
  { parts:["Hay"," tienda nueva en mi calle."," tienda vende ropa muy bonita."], answers:["una","La"], note:"" },
];

const dCard = document.getElementById('double-card');
DOUBLE.forEach((item, i) => {
  const div = document.createElement('div');
  div.className = 'exercise';
  let html = `<div class="ex-line"><span class="num">${i+1}.</span> ${item.parts[0]} <input type="text" id="d-${i}-0" autocomplete="off" spellcheck="false" placeholder="..."> ${item.parts[1]} <input type="text" id="d-${i}-1" autocomplete="off" spellcheck="false" placeholder="..."> ${item.parts[2]}</div>`;
  if (item.note) html += `<p class="ex-note">${item.note}</p>`;
  div.innerHTML = html;
  dCard.appendChild(div);
});

function norm(s) { return s.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function checkDouble() {
  let correct = 0, answered = 0;
  DOUBLE.forEach((item, i) => {
    item.answers.forEach((ans, j) => {
      const inp = document.getElementById(`d-${i}-${j}`);
      if (!inp.value.trim()) return;
      answered++;
      const ok = norm(inp.value) === norm(ans);
      inp.classList.toggle('correct', ok);
      inp.classList.toggle('wrong', !ok);
      if (ok) correct++;
    });
  });
  if (answered > 0) showScore('score-1', correct, answered);
}
function revealDouble() {
  DOUBLE.forEach((item, i) => {
    item.answers.forEach((ans, j) => {
      const inp = document.getElementById(`d-${i}-${j}`);
      inp.value = ans; inp.classList.add('correct'); inp.classList.remove('wrong');
    });
  });
  document.getElementById('score-1').style.display = 'none';
}
function resetDouble() {
  DOUBLE.forEach((item, i) => {
    item.answers.forEach((_, j) => {
      const inp = document.getElementById(`d-${i}-${j}`);
      inp.value = ''; inp.classList.remove('correct','wrong');
    });
  });
  document.getElementById('score-1').style.display = 'none';
}

// ── Exercise 2: MC context ─────────────────────────────
const MC_ITEMS = [
  { q:"¿Me pasas ___ sal, por favor? (La sal está sobre la mesa.)", opts:["una","la","—"], answer:"la", note:"objeto conocido, específico → determinado" },
  { q:"Hay ___ tienda nueva en mi barrio.", opts:["una","la"], answer:"una", note:"primera mención, desconocida → indeterminado" },
  { q:"Dame ___ libro que está en la estantería.", opts:["un","el"], answer:"el", note:"sabemos cuál → determinado" },
  { q:"Necesito ___ silla. (No hay ninguna aquí.)", opts:["una","la"], answer:"una", note:"no existe todavía en el contexto → indeterminado" },
  { q:"¿Dónde está ___ médico? (Tenemos cita.)", opts:["un","el"], answer:"el", note:"médico concreto y conocido → determinado" },
  { q:"Busco ___ médico que hable sueco.", opts:["un","el"], answer:"un", note:"cualquier médico, no uno específico → indeterminado" },
];

const mcSel = {};
const mcCard = document.getElementById('mc-card');
MC_ITEMS.forEach((item, i) => {
  mcSel[i] = null;
  const div = document.createElement('div');
  div.className = 'mc-item';
  const optsHTML = item.opts.map(o =>
    `<button class="mc-btn" id="mc-${i}-${o}" onclick="selMC(${i},'${o}')">${o}</button>`
  ).join('');
  div.innerHTML = `<div class="mc-q"><span class="mc-num">${i+1}.</span> ${item.q}</div>
    <div class="mc-opts">${optsHTML}</div>`;
  mcCard.appendChild(div);
});

function selMC(i, opt) {
  if (mcSel[i]) document.getElementById(`mc-${i}-${mcSel[i]}`).classList.remove('selected');
  mcSel[i] = mcSel[i] === opt ? null : opt;
  if (mcSel[i]) document.getElementById(`mc-${i}-${mcSel[i]}`).classList.add('selected');
}
function checkMC() {
  let correct = 0, answered = 0;
  MC_ITEMS.forEach((item, i) => {
    if (!mcSel[i]) return;
    answered++;
    item.opts.forEach(o => document.getElementById(`mc-${i}-${o}`).classList.remove('selected','correct','wrong','reveal'));
    if (mcSel[i] === item.answer) { correct++; document.getElementById(`mc-${i}-${item.answer}`).classList.add('correct'); }
    else { document.getElementById(`mc-${i}-${mcSel[i]}`).classList.add('wrong'); document.getElementById(`mc-${i}-${item.answer}`).classList.add('reveal'); }
  });
  if (answered > 0) showScore('score-2', correct, answered);
}
function revealMC() {
  MC_ITEMS.forEach((item, i) => {
    item.opts.forEach(o => document.getElementById(`mc-${i}-${o}`).classList.remove('selected','correct','wrong','reveal'));
    document.getElementById(`mc-${i}-${item.answer}`).classList.add('reveal');
  });
  document.getElementById('score-2').style.display = 'none';
}
function resetMC() {
  MC_ITEMS.forEach((item, i) => {
    mcSel[i] = null;
    item.opts.forEach(o => document.getElementById(`mc-${i}-${o}`).classList.remove('selected','correct','wrong','reveal'));
  });
  document.getElementById('score-2').style.display = 'none';
}
function showScore(id, correct, total) {
  const b = document.getElementById(id);
  b.style.display = 'block';
  b.innerHTML = `<strong>${correct} de ${total}</strong> correctas`;
}
</script>
</body>
</html>
