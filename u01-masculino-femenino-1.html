<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masculino y Femenino (1) · SpanishMind</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#faf7f2; --card:#ffffff; --accent:#b85c38; --accent2:#e8c4a0; --text:#2a1f14; --muted:#8a7a6a; --ok:#3a7d44; --err:#c0392b; --border:#e0d6c8; }
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; font-weight:300; min-height:100vh; padding:2rem 1rem 4rem; }
    header { text-align:center; margin-bottom:2rem; }
    .brand { font-family:'Playfair Display',serif; font-size:0.85rem; letter-spacing:0.25em; text-transform:uppercase; color:var(--accent); margin-bottom:0.5rem; }
    h1 { font-family:'Playfair Display',serif; font-size:clamp(1.8rem,5vw,2.8rem); font-weight:700; line-height:1.1; }
    .subtitle { margin-top:0.5rem; color:var(--muted); font-size:0.95rem; }
    .section-title { font-family:'Playfair Display',serif; font-style:italic; color:var(--muted); font-size:0.95rem; text-align:center; max-width:640px; margin:1.5rem auto 0.75rem; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:2rem; max-width:640px; margin:0 auto 1.5rem; box-shadow:0 2px 12px rgba(0,0,0,0.04); }
    .exercise { display:flex; align-items:baseline; gap:0.5rem; padding:1rem 0; border-bottom:1px solid var(--border); flex-wrap:wrap; }
    .exercise:last-child { border-bottom:none; }
    .num { font-family:'Playfair Display',serif; font-style:italic; color:var(--accent); min-width:1.4rem; }
    .sentence { font-size:1rem; line-height:1.7; flex:1; min-width:0; }
    .blank-wrap { display:inline-flex; flex-direction:column; align-items:center; vertical-align:baseline; margin:0 2px; }
    input[type="text"] { font-family:'DM Sans',sans-serif; font-size:1rem; width:110px; border:none; border-bottom:2px solid var(--accent2); background:transparent; color:var(--text); padding:2px 4px; text-align:center; outline:none; transition:border-color 0.2s; }
    input[type="text"]:focus { border-color:var(--accent); }
    input[type="text"].correct { border-color:var(--ok); color:var(--ok); }
    input[type="text"].wrong { border-color:var(--err); color:var(--err); }
    .btn-row { display:flex; gap:0.75rem; justify-content:center; max-width:640px; margin:0 auto 1.5rem; flex-wrap:wrap; }
    button { font-family:'DM Sans',sans-serif; font-size:0.9rem; font-weight:500; padding:0.65rem 1.4rem; border-radius:6px; border:none; cursor:pointer; transition:opacity 0.15s,transform 0.1s; }
    button:active { transform:scale(0.97); }
    .btn-check { background:var(--accent); color:#fff; }
    .btn-reset { background:transparent; border:1px solid var(--border); color:var(--muted); }
    .btn-reveal { background:transparent; border:1px solid var(--accent2); color:var(--accent); }
    .score-box { display:none; text-align:center; padding:0.75rem 1rem; border-radius:8px; font-size:0.95rem; max-width:640px; margin:0 auto 1.5rem; background:var(--accent2); color:var(--text); }
    /* Gender grid */
    .word-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:0.6rem; }
    .word-chip { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:0.75rem; }
    .word-chip .w { font-family:'Playfair Display',serif; font-style:italic; font-size:1.05rem; margin-bottom:0.5rem; display:block; }
    .gender-btns { display:flex; gap:0.4rem; }
    .gbtn { flex:1; font-size:0.75rem; padding:0.3rem; border-radius:4px; border:1px solid var(--border); background:transparent; cursor:pointer; transition:all 0.15s; }
    .gbtn.sel-M { background:#dbeafe; border-color:#3b82f6; color:#1d4ed8; }
    .gbtn.sel-F { background:#fce7f3; border-color:#ec4899; color:#be185d; }
    .gbtn.ok { background:var(--ok); color:white; border-color:var(--ok); }
    .gbtn.err { background:var(--err); color:white; border-color:var(--err); }
    footer { text-align:center; margin-top:2.5rem; font-size:0.8rem; color:var(--muted); }
    footer a { color:var(--accent); text-decoration:none; }
  </style>
</head>
<body>
<header>
  <div class="brand">SpanishMind</div>
  <h1>Masculino y Femenino</h1>
  <p class="subtitle">Unidad 1 · Personas y animales</p>
</header>

<p class="section-title">Ejercicio 1 — Clasifica cada palabra: ¿masculino o femenino?</p>
<div class="card">
  <div class="word-grid" id="gender-grid"></div>
</div>
<div class="btn-row">
  <button class="btn-check" onclick="checkGender()">Corregir</button>
  <button class="btn-reset" onclick="resetGender()">Empezar de nuevo</button>
</div>
<div id="score-1" class="score-box"></div>

<p class="section-title">Ejercicio 2 — Escribe la forma contraria</p>
<div class="card" id="pair-card"></div>
<div class="btn-row">
  <button class="btn-check" onclick="checkPairs()">Corregir</button>
  <button class="btn-reveal" onclick="revealPairs()">Ver respuestas</button>
  <button class="btn-reset" onclick="resetPairs()">Empezar de nuevo</button>
</div>
<div id="score-2" class="score-box"></div>

<footer><a href="https://spanishmind.se">spanishmind.se</a></footer>

<script>
// ── Exercise 1: Gender Classification ──────────────────
const GENDER_WORDS = [
  { word:"hijo",    gender:"M" }, { word:"hija",    gender:"F" },
  { word:"actor",   gender:"M" }, { word:"actriz",  gender:"F" },
  { word:"rey",     gender:"M" }, { word:"reina",   gender:"F" },
  { word:"maestro", gender:"M" }, { word:"maestra", gender:"F" },
  { word:"señor",   gender:"M" }, { word:"señora",  gender:"F" },
  { word:"perro",   gender:"M" }, { word:"perra",   gender:"F" },
];

const gState = {};
const grid = document.getElementById('gender-grid');
GENDER_WORDS.forEach((w, i) => {
  gState[i] = null;
  const chip = document.createElement('div');
  chip.className = 'word-chip';
  chip.innerHTML = `<span class="w">${w.word}</span>
    <div class="gender-btns">
      <button class="gbtn" id="gb-${i}-M" onclick="selectG(${i},'M')">M</button>
      <button class="gbtn" id="gb-${i}-F" onclick="selectG(${i},'F')">F</button>
    </div>`;
  grid.appendChild(chip);
});

function selectG(i, g) {
  gState[i] = gState[i] === g ? null : g;
  ['M','F'].forEach(x => {
    const b = document.getElementById(`gb-${i}-${x}`);
    b.classList.remove('sel-M','sel-F','ok','err');
    if (gState[i] === x) b.classList.add(x === 'M' ? 'sel-M' : 'sel-F');
  });
}

function checkGender() {
  let correct = 0, answered = 0;
  GENDER_WORDS.forEach((w, i) => {
    if (!gState[i]) return;
    answered++;
    ['M','F'].forEach(x => document.getElementById(`gb-${i}-${x}`).classList.remove('sel-M','sel-F','ok','err'));
    if (gState[i] === w.gender) {
      correct++;
      document.getElementById(`gb-${i}-${w.gender}`).classList.add('ok');
    } else {
      document.getElementById(`gb-${i}-${gState[i]}`).classList.add('err');
      document.getElementById(`gb-${i}-${w.gender}`).classList.add('ok');
    }
  });
  if (answered > 0) showScore('score-1', correct, answered);
}

function resetGender() {
  GENDER_WORDS.forEach((_, i) => {
    gState[i] = null;
    ['M','F'].forEach(x => document.getElementById(`gb-${i}-${x}`).classList.remove('sel-M','sel-F','ok','err'));
  });
  document.getElementById('score-1').style.display = 'none';
}

// ── Exercise 2: Complete the pair ──────────────────────
const PAIRS = [
  { clue:"el niño →",      dir:"la",  answer:"niña"     },
  { clue:"la profesora →", dir:"el",  answer:"profesor"  },
  { clue:"el actor →",     dir:"la",  answer:"actriz"    },
  { clue:"el rey →",       dir:"la",  answer:"reina"     },
  { clue:"la gata →",      dir:"el",  answer:"gato"      },
  { clue:"el señor →",     dir:"la",  answer:"señora"    },
  { clue:"el hermano →",   dir:"la",  answer:"hermana"   },
  { clue:"la mujer →",     dir:"el",  answer:"hombre"    },
];

const pairCard = document.getElementById('pair-card');
PAIRS.forEach((p, i) => {
  const row = document.createElement('div');
  row.className = 'exercise';
  row.innerHTML = `<span class="num">${i+1}.</span>
    <span class="sentence">${p.clue} ${p.dir}
      <span class="blank-wrap">
        <input type="text" id="pair-${i}" autocomplete="off" spellcheck="false" placeholder="..."
               onkeydown="if(event.key==='Enter') checkPairs()">
      </span>
    </span>`;
  pairCard.appendChild(row);
});

function norm(s) { return s.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }

function checkPairs() {
  let correct = 0, answered = 0;
  PAIRS.forEach((p, i) => {
    const inp = document.getElementById('pair-'+i);
    if (!inp.value.trim()) return;
    answered++;
    const ok = norm(inp.value) === norm(p.answer);
    inp.classList.toggle('correct', ok);
    inp.classList.toggle('wrong', !ok);
    if (ok) correct++;
  });
  if (answered > 0) showScore('score-2', correct, answered);
}
function revealPairs() {
  PAIRS.forEach((p, i) => {
    const inp = document.getElementById('pair-'+i);
    inp.value = p.answer; inp.classList.add('correct'); inp.classList.remove('wrong');
  });
  document.getElementById('score-2').style.display = 'none';
}
function resetPairs() {
  PAIRS.forEach((_, i) => {
    const inp = document.getElementById('pair-'+i);
    inp.value = ''; inp.classList.remove('correct','wrong');
  });
  document.getElementById('score-2').style.display = 'none';
}

function showScore(id, correct, total) {
  const box = document.getElementById(id);
  box.style.display = 'block';
  box.innerHTML = `<strong>${correct} de ${total}</strong> correctas`;
}
</script>
</body>
</html>
